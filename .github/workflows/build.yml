name: Build Agora APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Unzip Source Code
        run: |
          unzip Agora.zip
          rm Agora.zip
          if [ -d "Agora" ]; then
            mv Agora/* .
            mv Agora/.* . 2>/dev/null || true
            rm -rf Agora
          elif [ -d "Agora-master" ]; then
            mv Agora-master/* .
            mv Agora-master/.* . 2>/dev/null || true
            rm -rf Agora-master
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Agora-debug
          path: app/build/outputs/apk/debug/app-debug.apk
